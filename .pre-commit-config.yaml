repos:
  - repo: local
    hooks:
      - id: api-rspec
        name: Run RSpec
        entry: docker compose -f docker-compose.dev.yml exec -T api bundle exec rspec
        language: system
        pass_filenames: false
        files: ^api/

      - id: api-rubocop
        name: Run Rubocop
        entry: docker compose -f docker-compose.dev.yml exec -T api bundle exec rubocop
        language: system
        pass_filenames: false
        files: ^api/.*\.rb$

      - id: api-brakeman
        name: Run Brakeman
        entry: docker compose -f docker-compose.dev.yml exec -T api bundle exec brakeman -z
        language: system
        pass_filenames: false
        files: ^api/

      - id: client-lint
        name: Run client linter
        entry: bash -lc 'cd client && npm run lint'
        language: system
        pass_filenames: false
        files: ^client/

      - id: client-typecheck
        name: Run client typecheck
        entry: bash -lc 'cd client && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^client/

      - id: client-format-check
        name: Check client formatting
        entry: bash -lc 'cd client && npm run format:check'
        language: system
        pass_filenames: false
        files: ^client/
