    create_user_request:
      type: object
      description: Request body for creating a new user account
      required:
      - user
      properties:
        user:
          type: object
          required:
          - email
          - first_name
          - last_name
          - password
          - password_confirmation
          properties:
            email:
              type: string
              format: email
            first_name:
              type: string
            last_name:
              type: string
            password:
              type: string
              format: password
            password_confirmation:
              type: string
              format: password
