    attendance_confirmation:
      type: object
      description: An attendance confirmation for a specific time period.
      required:
      - id
      - user_id
      - office_id
      - period_type
      - starts_on
      properties:
        id:
          type: integer
        user_id:
          type: integer
        office_id:
          type: integer
        period_type:
          type: string
          enum:
          - week
        starts_on:
          type: string
          format: date
          description: The normalized start date of the confirmation period.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    create_attendance_confirmation_request:
      type: object
      description: Request body for confirming attendance for a week.
      required:
      - office_id
      - starts_on
      - selected_dates
      properties:
        office_id:
          type: integer
          description: The office for which attendance is being confirmed.
        starts_on:
          type: string
          format: date
          description: Any date within the week being confirmed. The API normalizes
            this value to the Monday of that week.
        selected_dates:
          type: array
          description: The dates for which visits should exist. An empty array confirms
            the week without creating visits.
          items:
            type: string
            format: date
