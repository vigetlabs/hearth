---
openapi: 3.0.1
info:
  title: Intern Project API
  version: v1
paths:
  "/api/v1/users":
    post:
      summary: Creates a user account
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: user created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_response"
        '422':
          description: invalid user params
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_user_request"
        required: true
  "/api/v1/users/login":
    post:
      summary: Logs in a user to their account
      tags:
      - Users
      parameters: []
      responses:
        '200':
          description: logged in successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_response"
        '401':
          description: invalid login credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_devise_invalid_login_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/login_user_request"
        required: true
  "/api/v1/users/logout":
    delete:
      summary: Logs out a user from their active authenticated session
      tags:
      - Users
      security:
      - cookie_auth: []
      parameters:
      - name: Cookie
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: logged out user successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/generic_success_response"
        '401':
          description: invalid active session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/generic_error_response"
  "/api/v1/users/me":
    get:
      summary: Fetches user information for current authenticated user
      tags:
      - Users
      security:
      - cookie_auth: []
      responses:
        '200':
          description: fetched user successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_response"
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
components:
  schemas:
    generic_success_response:
      type: object
      description: Generic success response body
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          nullable: true
          description: No resource payload is returned for this response
          example:
    generic_error_response:
      type: object
      description: Generic error response body
      required:
      - status
      - errors
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        errors:
          type: array
          items:
            type: object
            description: One individual error detail, usually used inside an errors
              array.
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    status:
      type: object
      description: Shared status metadata returned by API responses.
      required:
      - message
      properties:
        message:
          type: string
    user:
      type: object
      description: Public user account data returned by the API.
      required:
      - id
      - email
      - first_name
      - last_name
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    user_response:
      type: object
      description: Full response body for endpoints that return one user.
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          type: object
          required:
          - user
          properties:
            user:
              type: object
              description: Public user account data returned by the API.
              required:
              - id
              - email
              - first_name
              - last_name
              properties:
                id:
                  type: integer
                email:
                  type: string
                  format: email
                first_name:
                  type: string
                last_name:
                  type: string
    user_devise_invalid_login_response:
      type: object
      description: Full response body for invalid login request
      required:
      - error
      properties:
        error:
          type: string
          description: Devise authentication error message
          example: Invalid Email or password.
    create_user_request:
      type: object
      description: Request body for creating a new user account
      required:
      - user
      properties:
        user:
          type: object
          required:
          - email
          - first_name
          - last_name
          - password
          - password_confirmation
          properties:
            email:
              type: string
              format: email
            first_name:
              type: string
            last_name:
              type: string
            password:
              type: string
              format: password
            password_confirmation:
              type: string
              format: password
    login_user_request:
      type: object
      description: Request body for logging in to a user account.
      required:
      - user
      properties:
        user:
          type: object
          description: Credentials for the user account being authenticated.
          required:
          - email
          - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              format: password
              writeOnly: true
    error:
      type: object
      description: One individual error detail, usually used inside an errors array.
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    error_response:
      type: object
      description: Full response body for a generic API error without field-level
        details.
      required:
      - status
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
    validation_error_response:
      type: object
      description: Full response body for validation errors with field-level details.
      required:
      - status
      - errors
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        errors:
          type: array
          items:
            type: object
            description: One individual error detail, usually used inside an errors
              array.
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
