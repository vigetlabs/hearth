---
openapi: 3.0.1
info:
  title: Hearth API
  version: v1
paths:
  "/api/v1/attendance_confirmations":
    get:
      summary: Fetch attendance confirmations
      tags:
      - Attendance Confirmations
      security:
      - cookie_auth: []
      parameters:
      - name: office_id
        in: query
        required: true
        schema:
          type: integer
        description: The office whose confirmations should be returned.
      - name: starts_on
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Any date within the requested week. The API normalizes this value
          to the Monday of that week.
      responses:
        '200':
          description: attendance confirmations fetched successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/attendance_confirmations_response"
        '400':
          description: parameter has an invalid format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_request_error_response"
        '401':
          description: authentication is required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
        '404':
          description: office was not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_error_response"
    post:
      summary: Confirm attendance for a week
      tags:
      - Attendance Confirmations
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '200':
          description: attendance confirmed successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/create_attendance_confirmation_response"
        '400':
          description: request contains invalid selected dates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_request_error_response"
        '401':
          description: authentication is required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
        '404':
          description: office was not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found_error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_attendance_confirmation_request"
        required: true
  "/api/v1/offices":
    get:
      summary: Fetches all offices
      tags:
      - Offices
      responses:
        '200':
          description: offices fetched successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/offices_response"
  "/api/v1/schedules/default":
    get:
      summary: Fetches the current user's default schedule
      tags:
      - Schedules
      security:
      - cookie_auth: []
      responses:
        '200':
          description: fetched default schedule successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/schedule_response"
        '401':
          description: authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
  "/api/v1/schedules":
    post:
      summary: Creates a schedule
      tags:
      - Schedules
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: schedule created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/schedule_response"
        '422':
          description: invalid schedule parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
        '400':
          description: missing schedule parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_request_error_response"
        '401':
          description: authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_schedule_request"
        required: true
  "/api/v1/users/auth/google":
    get:
      summary: Starts the Google SSO
      tags:
      - Users
      responses:
        '302':
          description: redirects to the Google OAuth authorization flow
  "/api/v1/users/auth/failure":
    get:
      summary: Handles failed Google SSO attempt
      tags:
      - Users
      responses:
        '302':
          description: redirects to the frontend with an error path in URL
  "/api/v1/users/auth/google_oauth2/callback":
    get:
      summary: Handles the Google OAuth callback
      tags:
      - Users
      responses:
        '302':
          description: sets the JWT cookie and redirects to the frontend profile
  "/api/v1/users":
    post:
      summary: Creates a user account
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: user created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_response"
        '400':
          description: missing user parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_request_error_response"
        '422':
          description: invalid user params
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_user_request"
        required: true
  "/api/v1/users/login":
    post:
      summary: Logs in a user to their account
      tags:
      - Users
      parameters: []
      responses:
        '200':
          description: logged in successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_response"
        '401':
          description: missing required login parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/login_user_request"
        required: true
  "/api/v1/users/logout":
    delete:
      summary: Logs out a user from their active authenticated session
      tags:
      - Users
      security:
      - cookie_auth: []
      parameters:
      - name: Cookie
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: logged out user successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/empty_success_response"
        '401':
          description: invalid active session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
  "/api/v1/users/me":
    get:
      summary: Fetches user information for current authenticated user
      tags:
      - Users
      security:
      - cookie_auth: []
      responses:
        '200':
          description: fetched user successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_response"
    patch:
      summary: Updates user information for current authenticated user
      tags:
      - Users
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '401':
          description: invalid active session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
        '200':
          description: updated user successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/patch_user_request"
        required: true
  "/api/v1/visits/mine":
    get:
      summary: Retrieves the authenticated user's visits for a calendar range
      tags:
      - Visits
      security:
      - cookie_auth: []
      parameters:
      - name: date
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/visit_date"
        description: Anchor date for the calendar range. Defaults to the current date.
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - week
          default: week
        description: Calendar view used to calculate the returned range.
      responses:
        '200':
          description: user visits fetched successfully
          content:
            Application/json:
              schema:
                "$ref": "#/components/schemas/visits_response"
        '400':
          description: invalid query parameters
          content:
            Application/json:
              schema:
                "$ref": "#/components/schemas/bad_request_error_response"
  "/api/v1/visits":
    get:
      summary: Retrieves visits for a calendar range
      tags:
      - Visits
      security:
      - cookie_auth: []
      parameters:
      - name: date
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/visit_date"
        description: Anchor date for the calendar range. Defaults to the current date.
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - week
          default: week
        description: Calendar view used to calculate the returned range.
      - name: office_id
        in: query
        required: true
        schema:
          type: integer
        description: ID of the office whose visits should be returned.
      responses:
        '400':
          description: invalid query parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_request_error_response"
        '401':
          description: authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
    post:
      summary: Creates user visits
      tags:
      - Visits
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: visits created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/visits_response"
        '400':
          description: missing visits parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bad_request_error_response"
        '401':
          description: authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authentication_error_response"
        '422':
          description: invalid visits parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_error_response"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/create_visits_request"
        required: true
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
components:
  schemas:
    status:
      type: object
      description: Shared status metadata returned by API responses.
      required:
      - message
      properties:
        message:
          type: string
    field_error:
      type: object
      description: One individual field error, usually used inside an errors array.
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    validation_error_response:
      type: object
      description: Full response body for validation errors with field-level details.
      required:
      - status
      - error
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        error:
          type: object
          required:
          - type
          - code
          - details
          properties:
            type:
              type: string
              enum:
              - validation_error
            code:
              type: string
              enum:
              - invalid_attributes
            details:
              type: array
              items:
                type: object
                description: One individual field error, usually used inside an errors
                  array.
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
    authentication_error_response:
      type: object
      description: Full response body for invalid active sessions.
      required:
      - status
      - error
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        error:
          type: object
          required:
          - type
          - code
          properties:
            type:
              type: string
              enum:
              - authentication_error
            code:
              type: string
              enum:
              - authentication_required
              - invalid_credentials
    not_found_error_response:
      type: object
      description: Full response body for record not found errors.
      required:
      - status
      - error
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        error:
          type: object
          required:
          - type
          - code
          - resource
          properties:
            type:
              type: string
              enum:
              - not_found_error
            code:
              type: string
              enum:
              - resource_not_found
            resource:
              type: string
              enum:
              - user
              - office
              - schedule
              - visit
    bad_request_error_response:
      type: object
      description: Full response body for malformed request bodies.
      required:
      - status
      - error
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        error:
          type: object
          required:
          - type
          - code
          properties:
            type:
              type: string
              enum:
              - bad_request_error
            code:
              type: string
              enum:
              - bad_request
              - missing_parameter
              - malformed_json
              - invalid_parameter_format
            field:
              type: string
              nullable: true
              example: user
    empty_success_response:
      type: object
      description: Generic success response body
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          nullable: true
          description: No resource payload is returned for this response
          example:
    schedule:
      type: object
      description: Public schedule data returned by the API.
      required:
      - id
      - is_default
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      properties:
        id:
          type: integer
        is_default:
          type: boolean
        monday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        tuesday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        wednesday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        thursday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        friday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        saturday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        sunday:
          type: boolean
          description: Whether the user has selected this day in their schedule
    schedule_attributes:
      type: object
      required:
      - is_default
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      properties:
        is_default:
          type: boolean
        monday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        tuesday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        wednesday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        thursday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        friday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        saturday:
          type: boolean
          description: Whether the user has selected this day in their schedule
        sunday:
          type: boolean
          description: Whether the user has selected this day in their schedule
    create_schedule_request:
      type: object
      description: Request body for creating a new schedule
      required:
      - schedule
      properties:
        schedule:
          type: object
          required:
          - is_default
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
          properties:
            is_default:
              type: boolean
            monday:
              type: boolean
              description: Whether the user has selected this day in their schedule
            tuesday:
              type: boolean
              description: Whether the user has selected this day in their schedule
            wednesday:
              type: boolean
              description: Whether the user has selected this day in their schedule
            thursday:
              type: boolean
              description: Whether the user has selected this day in their schedule
            friday:
              type: boolean
              description: Whether the user has selected this day in their schedule
            saturday:
              type: boolean
              description: Whether the user has selected this day in their schedule
            sunday:
              type: boolean
              description: Whether the user has selected this day in their schedule
    schedule_response:
      type: object
      description: Full response body for endpoints that return a single schedule.
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          type: object
          required:
          - schedule
          properties:
            schedule:
              type: object
              description: Public schedule data returned by the API.
              required:
              - id
              - is_default
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday
              properties:
                id:
                  type: integer
                is_default:
                  type: boolean
                monday:
                  type: boolean
                  description: Whether the user has selected this day in their schedule
                tuesday:
                  type: boolean
                  description: Whether the user has selected this day in their schedule
                wednesday:
                  type: boolean
                  description: Whether the user has selected this day in their schedule
                thursday:
                  type: boolean
                  description: Whether the user has selected this day in their schedule
                friday:
                  type: boolean
                  description: Whether the user has selected this day in their schedule
                saturday:
                  type: boolean
                  description: Whether the user has selected this day in their schedule
                sunday:
                  type: boolean
                  description: Whether the user has selected this day in their schedule
    schedules_response:
      type: object
      description: Full response body for endpoints that return multiple schedules.
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          type: object
          required:
          - schedules
          properties:
            schedules:
              type: array
              items:
                type: object
                description: Public schedule data returned by the API.
                required:
                - id
                - is_default
                - monday
                - tuesday
                - wednesday
                - thursday
                - friday
                - saturday
                - sunday
                properties:
                  id:
                    type: integer
                  is_default:
                    type: boolean
                  monday:
                    type: boolean
                    description: Whether the user has selected this day in their schedule
                  tuesday:
                    type: boolean
                    description: Whether the user has selected this day in their schedule
                  wednesday:
                    type: boolean
                    description: Whether the user has selected this day in their schedule
                  thursday:
                    type: boolean
                    description: Whether the user has selected this day in their schedule
                  friday:
                    type: boolean
                    description: Whether the user has selected this day in their schedule
                  saturday:
                    type: boolean
                    description: Whether the user has selected this day in their schedule
                  sunday:
                    type: boolean
                    description: Whether the user has selected this day in their schedule
    office:
      type: object
      description: Public office data returned by the API.
      required:
      - id
      - name
      - city
      - state
      - timezone
      - emoji
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
          example: Boulder
        state:
          type: string
          example: CO
        timezone:
          type: string
          example: America/Denver
        emoji:
          type: string
          example: "\U0001F3D4️"
    office_response:
      type: object
      description: Full response body for endpoints that return a single office.
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          type: object
          required:
          - office
          properties:
            office:
              type: object
              description: Public office data returned by the API.
              required:
              - id
              - name
              - city
              - state
              - timezone
              - emoji
              properties:
                id:
                  type: integer
                name:
                  type: string
                city:
                  type: string
                  example: Boulder
                state:
                  type: string
                  example: CO
                timezone:
                  type: string
                  example: America/Denver
                emoji:
                  type: string
                  example: "\U0001F3D4️"
    offices_response:
      type: object
      description: Full response body for endpoints that return a single office.
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          type: object
          required:
          - offices
          properties:
            offices:
              type: array
              items:
                type: object
                description: Public office data returned by the API.
                required:
                - id
                - name
                - city
                - state
                - timezone
                - emoji
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  city:
                    type: string
                    example: Boulder
                  state:
                    type: string
                    example: CO
                  timezone:
                    type: string
                    example: America/Denver
                  emoji:
                    type: string
                    example: "\U0001F3D4️"
    visit:
      type: object
      description: Public visit data returned by the API.
      required:
      - id
      - user
      - visit_date
      - created_at
      - updated_at
      - office_id
      properties:
        id:
          type: integer
        user:
          type: object
          required:
          - id
          - first_name
          - last_name
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
        visit_date:
          type: string
          format: date
          description: Calendar date only with no timezone (YYYY-MM-DD)
          example: '2026-07-10'
        created_at:
          type: string
          format: date-time
          description: Created-at time in ISO 8601 format
          example: '2026-07-10T13:42:18.123Z'
        updated_at:
          type: string
          format: date-time
          description: Updated-at time in ISO 8601 format
          example: '2026-07-10T13:42:18.123Z'
        office_id:
          type: integer
    visit_date:
      type: string
      format: date
      description: Calendar date only with no timezone (YYYY-MM-DD)
      example: '2026-07-10'
    create_visits_request:
      type: object
      description: Request body for creating a new visit
      required:
      - visits
      properties:
        visits:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - visit_date
            - office_id
            properties:
              visit_date:
                type: string
                format: date
                description: Calendar date only with no timezone (YYYY-MM-DD)
                example: '2026-07-10'
              office_id:
                type: integer
    visit_response:
      type: object
      description: Full response body for endpoints that return a single visit.
      required:
      - status
      - data
      properties:
        status:
          type: object
          description: Shared status metadata returned by API responses.
          required:
          - message
          properties:
            message:
              type: string
        data:
          type: object
          required:
          - visit
          properties:
            visit:
              type: object
              description: Public visit data returned by the API.
              required:
              - id
              - user
              - visit_date
              - created_at
              - updated_at
              - office_id
              properties:
                id:
                  type: integer
                user:
                  type: object
                  required:
                  - id
                  - first_name
                  - last_name
                  properties:
                    id:
                      type: integer
                    first_name:
                      type: string
                    last_name:
                      type: string
                visit_date:
                  type: string
                  format: date
                  description: Calendar date only with no timezone (YYYY-MM-DD)
                  example: '2026-07-10'
                created_at:
                  type: string
                  format: date-time
                  description: Created-at time in ISO 8601 format
                  example: '2026-07-10T13:42:18.123Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Updated-at time in ISO 8601 format
                  example: '2026-07-10T13:42:18.123Z'
                office_id:
                  type: integer
    visits_response:
