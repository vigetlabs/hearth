default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>


development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "dev_db") %>

  queue:
    <<: *default
    database: hearth_queue_development
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("TEST_DATABASE_NAME", "test_db") %>

staging:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "hearth_staging") %>
    database: api_production
    host: <%= ENV.fetch("DATABASE_HOST", "db") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    username: api
    password: <%= ENV["API_DATABASE_PASSWORD"] %>

  queue:
    <<: *default
    database: <%= ENV.fetch("QUEUE_DATABASE_NAME", "hearth_queue_staging") %>
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    database: api_production
    host: <%= ENV.fetch("DATABASE_HOST", "db") %>
    port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
    username: api
    password: <%= ENV["API_DATABASE_PASSWORD"] %>

  queue:
    <<: *default
    database: <%= ENV.fetch("QUEUE_DATABASE_NAME", "hearth_queue_staging") %>
    migrations_paths: db/queue_migrate
